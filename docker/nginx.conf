server {
    listen 80;
    server_name _;
    # Serve only the public entry directory.
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 32k;

    # Forward unmatched paths to the Laravel router.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Execute only the application entry point.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
    }

    # Deny hidden files and other PHP entry points.
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
}
