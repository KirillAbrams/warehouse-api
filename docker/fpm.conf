; Настройки процессов, которые выполняют запросы приложения.
[www]
; Меняет число процессов по нагрузке в указанных пределах.
pm=dynamic
pm.max_children=24
pm.start_servers=4
pm.min_spare_servers=4
pm.max_spare_servers=8
; Передаёт процессам настройки контейнера и направляет сообщения в общий вывод.
clear_env=no
catch_workers_output=yes
